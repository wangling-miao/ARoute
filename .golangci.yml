version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam

  settings:
    goimports:
      local-prefixes: github.com/wangling-miao/aroute
    staticcheck:
      checks:
        - all

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
