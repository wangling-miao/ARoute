# Aroute CMS Configuration
# Copy this file to aroute.yaml and modify as needed.

# API settings
api:
  docs:
    enabled: false
    ui: "swagger"  # "swagger" or "redoc"

# Server settings
server:
  host: "0.0.0.0"
  port: 8080
  # CORS settings
  cors:
    allowed_origins:
      - "http://localhost:8080"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Authorization"
      - "Content-Type"
# Database configuration
database:
  # Driver: "sqlite" or "postgres"
  driver: "sqlite"

  # SQLite settings (used when driver is "sqlite")
  sqlite:
    path: "data/aroute.db"

  # PostgreSQL settings (used when driver is "postgres")
  # IMPORTANT: Override sensitive values via environment variables in production
  # postgres:
  #   host: "localhost"
  #   port: 5432
  #   user: "${POSTGRES_USER:-aroute}"
  #   password: "${POSTGRES_PASSWORD}"  # REQUIRED — set via env var
  #   dbname: "${POSTGRES_DB:-aroute}"
  #   sslmode: "prefer"

# Authentication
auth:
  # IMPORTANT: Override via AROUTE_AUTH_JWT_SECRET environment variable in production
  jwt_secret: "${AUTH_JWT_SECRET}"  # CHANGE ME - use a strong random string
  jwt_algorithm: "HS256"
  # RS256 key paths (required when jwt_algorithm is RS256/RS384/RS512):
  # jwt_private_key_path: "configs/keys/jwt_private.pem"
  # jwt_public_key_path: "configs/keys/jwt_public.pem"
  access_token_ttl: "15m"
  refresh_token_ttl: "7d"
  rotate_refresh_tokens: true
  bcrypt_cost: 10
  rate_limit:
    max_attempts: 5
    window: "1m"
  admin:
    # IMPORTANT: Override via AROUTE_AUTH_ADMIN_PASSWORD environment variable
    email: "admin@localhost"
    password: ""  # Leave empty to auto-generate on first run

# Media storage
media:
  # Storage driver: "local" or "s3"
  storage: "local"
  # Local storage settings
  local:
    upload_dir: "data/uploads"
  # S3-compatible storage settings
  # s3:
  #   endpoint: "s3.amazonaws.com"
  #   bucket: "aroute-media"
  #   region: "us-east-1"
  #   access_key: ""
  #   secret_key: ""
  #   use_ssl: true

  # Upload limits
  max_file_size: "50MB"
  allowed_types:
    - "image/*"
    - "application/pdf"
    - "video/*"
    - "audio/*"

# Search
search:
  # Index storage directory
  index_dir: "data/search"

# Cache
cache:
  # Maximum cache size in MB
  max_size: 256
  # Default TTL for cached items
  default_ttl: "5m"

# Theme
theme:
  # Active theme name
  active: "default"
  # Theme directory
  dir: "themes"

# Logging
log:
  # Log level: debug, info, warn, error
  level: "info"
  # Log format: json, text
  format: "json"
  # Output target: stdout, file, both
  output: "both"
  # File logging settings (used when output is file or both)
  file:
    # Directory for log files (created if not exists)
    path: "data/logs"
    # Base name for log files
    name: "aroute.log"
    # Max size in MB before rotation
    max_size: 100
    # Max days to keep old log files (0 = forever)
    max_age: 30
    # Max number of old log files to keep (0 = all)
    max_backups: 10
    # Compress rotated log files
    compress: true
    
# Plugins directory
plugins:
  dir: "plugins"

# Data directory (for bbolt, search indices, uploads, etc.)
data_dir: "data"
