{{define "partials/header.html"}}
<header class="site-header">
  <div class="container">
    <h1 class="site-name">
      <a href="/">{{.Site.Title}}</a>
    </h1>
    {{if .Site.Tagline}}
    <p class="site-tagline">{{.Site.Tagline}}</p>
    {{end}}
    <nav class="site-nav">
      <a href="/">Home</a>
    </nav>
  </div>
</header>
{{end}}
