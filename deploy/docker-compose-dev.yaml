# Development Docker Compose configuration
# Override credentials via .env file or environment variables before deploying.
# Example .env:
#   POSTGRES_USER=aroute
#   POSTGRES_PASSWORD=your_secure_password
#   POSTGRES_DB=aroute
#   REDIS_PASSWORD=your_redis_password
services:
  postgres:
    image: postgres:16-alpine
    container_name: aroute-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_password}
      POSTGRES_DB: ${POSTGRES_DB:-aroute}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aroute} -d ${POSTGRES_DB:-aroute}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aroute-dev-net

  redis:
    image: redis:7-alpine
    container_name: aroute-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_only_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_only_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aroute-dev-net

volumes:
  postgres_data:
    name: aroute_postgres_dev_data
  redis_data:
    name: aroute_redis_dev_data

networks:
  aroute-dev-net:
    name: aroute-dev-network
    driver: bridge