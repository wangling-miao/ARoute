name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set variables
        id: vars
        run: |
          TAG=${GITHUB_REF_NAME}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w \
            -X github.com/wangling-miao/aroute/internal/version.Version=${{ steps.vars.outputs.tag }} \
            -X github.com/wangling-miao/aroute/internal/version.Commit=${{ steps.vars.outputs.commit }} \
            -X github.com/wangling-miao/aroute/internal/version.BuildDate=${{ steps.vars.outputs.build_date }}"

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -trimpath \
            -o bin/aroute-linux-amd64 ./cmd/aroute

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -trimpath \
            -o bin/aroute-linux-arm64 ./cmd/aroute

          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -trimpath \
            -o bin/aroute-darwin-amd64 ./cmd/aroute

          # macOS arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -trimpath \
            -o bin/aroute-darwin-arm64 ./cmd/aroute

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -trimpath \
            -o bin/aroute-windows-amd64.exe ./cmd/aroute

      - name: Create checksums
        run: |
          cd bin
          sha256sum aroute-* > checksums-sha256.txt

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          # Extract the section for this version (## X.Y.Z ... until next ## or EOF)
          NOTES=$(awk "/^## ${TAG}/,/^(## [0-9])/ {print}" CHANGELOG.md | sed "/^## [0-9]/d" | sed '/^$/d;1{/^$/d}')
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          echo "body<<EOFMARKER" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOFMARKER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          body: ${{ steps.vars.outputs.body }}
          files: |
            bin/aroute-linux-amd64
            bin/aroute-linux-arm64
            bin/aroute-darwin-amd64
            bin/aroute-darwin-arm64
            bin/aroute-windows-amd64.exe
            bin/checksums-sha256.txt
